name: Change log notify

# On every push to main: append auto change-log + email risks / overlooked.
# Does NOT commit back to main (that used to create "chore: append..." pushes
# which still triggered Vercel despite [skip ci]).
# Secrets (Settings → Secrets and variables → Actions):
#   SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS, SMTP_FROM
#   CHANGELOG_MAIL_TO (optional; default vishnu.vishwakarma@westernequipments.com)
#   VERCEL_TOKEN (optional; checks deploy status for the SHA)
#   VERCEL_ORG_ID, VERCEL_PROJECT_ID (optional; else read from .vercel/project.json)

on:
  push:
    branches: [main, master]

concurrency:
  group: change-log-notify-${{ github.ref }}
  cancel-in-progress: false

# No contents:write — do not push bot commits to main (those were triggering
# Vercel deploys; [skip ci] is ignored by Vercel unless ignoreCommand checks it).
permissions:
  contents: read

jobs:
  notify:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install nodemailer only
        run: npm install --no-save nodemailer@^9.0.1

      - name: Notify push change log
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          CHANGELOG_MAIL_TO: ${{ secrets.CHANGELOG_MAIL_TO }}
          CHANGELOG_MAIL_ALWAYS: ${{ vars.CHANGELOG_MAIL_ALWAYS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          node scripts/quality/notify-push-change-log.mjs \
            --before "${{ github.event.before }}" \
            --after "${{ github.sha }}"

      - name: Upload change-log artifacts (no commit to main)
        uses: actions/upload-artifact@v4
        with:
          name: change-log-auto
          path: |
            artifacts/change-log-auto.md
            artifacts/change-log-auto.csv
          if-no-files-found: ignore
