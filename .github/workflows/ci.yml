name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run check:feature-boundaries
        env:
          BOUNDARY_LIB_FEATURES: strict
      - run: npm test
      - run: npm run lint:ci
      - run: npm run typecheck
      - run: npm run build
      - run: node scripts/ci/audit-high.mjs
      - run: npm run knip
        continue-on-error: true
